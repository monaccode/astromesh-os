[Service]
# Fase 3.2: transition astromeshd into the named AppArmor profile on exec. The profile is
# loaded by apparmor.service at boot; this attaches the service to it regardless of the
# venv interpreter's exec path. A leading '-' would make a missing profile non-fatal; we
# WANT it fatal so a build that forgot to load the profile fails loudly.
AppArmorProfile=astromeshd
