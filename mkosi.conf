[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
CompressOutput=no
ImageId=astromesh-os-phase0
SplitArtifacts=uki,partitions
OutputDirectory=mkosi.output
# Fixed repart seed so UUIDs are reproducible across builds. Critical for A/B: /var
# is a SHARED partition, and its filesystem UUID (baked into each build's /etc/fstab)
# is seed-derived — without a fixed seed v1 and v2 disagree on it and v2's var.mount
# waits forever for a by-uuid device that never appears (→ emergency mode).
Seed=c0ffee00-cafe-4000-8000-0000a5710501

[Content]
Bootable=yes
Bootloader=systemd-boot
# Produce a Type 2 Unified Kernel Image (in the ESP /EFI/Linux) instead of a Type 1
# BLS entry, so A/B updates can replace the UKI file and systemd-boot picks the
# newest — the canonical sysupdate A/B-with-verity model.
UnifiedKernelImages=yes
# Route kernel + journal to the serial console so `mkosi qemu -nographic` / the CI
# boot harness can see boot progress and service startup.
KernelCommandLine=console=ttyS0 systemd.journald.forward_to_console=1
Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        ca-certificates
        python3
        python3-venv
        iproute2
        curl
        passwd
        # sfdisk (fdisk pkg) — the A/B updater relabels the inactive slot's GPT
        # partition UUIDs to the new verity roothash halves.
        fdisk
        apparmor
        apparmor-utils
        # Fase 3.3: raw TPM seal/unseal of the provider key. tpm2-tools is used with a
        # plain (non-encrypted) PCR-policy session — systemd-creds' TPM path needs AES-128-CFB
        # session encryption, which the available swtpm/libtpms does not provide.
        tpm2-tools
        linux-image-cloud-amd64
RemoveFiles=
        /usr/share/locale
        /usr/share/i18n/locales
        /usr/share/info
        /usr/share/lintian
        /usr/share/doc
        /usr/share/man
RootPassword=hashed:!

[Runtime]
# Local `mkosi qemu` test settings (CI drives QEMU directly via tests/boot).
RAM=2G
CPUs=2

[Validation]
# Fase 3.6: sign the UKI + systemd-boot with our self-owned db key, and stage the PK/KEK/db
# enrollment files in the ESP so systemd-boot auto-enrolls them when the firmware is in setup mode.
# Backward-compatible: non-SecureBoot OVMF (the other gates) ignores the signature and the staged
# keys, so those boots are unaffected.
SecureBoot=yes
SecureBootKey=phase3/secureboot/db.key
SecureBootCertificate=phase3/secureboot/db.crt
SecureBootAutoEnroll=yes

[Build]
# Bootable-image tools (ukify, systemd-boot, mtools, dosfstools) are installed on
# the CI runner — the apt mkosi ignores ToolsTree, so we provision them on the host.
# Build inputs (the .deb, stub payload, agent templates) are read from the source
# tree via $SRCDIR inside mkosi.postinst.chroot — see that script.
Environment=PHASE0_MODE
        ASTROMESH_BREAK_HEALTH
        ASTROMESH_BREAKGLASS_HASH
        ASTROMESH_SEAL_SECRET
