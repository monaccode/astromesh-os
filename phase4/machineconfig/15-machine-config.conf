[Unit]
# Order astromeshd after the machine-config oneshot so /run/astromesh/config is ready when the
# launcher runs. Wants= (not Requires=): an invalid profile fails the oneshot and leaves the node on
# the baked default with a visible error marker, but does not block the runtime from starting.
Wants=astromesh-machine-config.service
After=astromesh-machine-config.service

[Service]
# Replace the baked ExecStart with the launcher, which selects the config dir at exec time.
ExecStart=
ExecStart=/usr/lib/astromesh-os/astromeshd-config-launch.sh
