[Unit]
# §12.3 memory governance — always-on hardening (like 30-sandbox.conf / 40-egress.conf). Fail-closed:
# astromeshd Requires= the self-check, which runs FIRST and verifies the kernel enforces cgroup memory
# limits. If it can't, the check fails -> Requires= fails -> astromeshd does not start.
Requires=astromesh-memory-check.service
After=astromesh-memory-check.service

[Service]
MemoryAccounting=yes
# Percentages of physical RAM -> scale with VM size. astromeshd uses ~200 MB, far below 70/80%
# (1.4/1.6 GB on a 2 GB VM), so normal workloads are unaffected; only a runaway is capped.
MemoryHigh=70%
MemoryMax=80%
# No swap to mask the limit.
MemorySwapMax=0
# Deterministic recovery: a cgroup-OOM kill marks the unit failed -> systemd restarts it.
OOMPolicy=kill
Restart=on-failure
RestartSec=2
