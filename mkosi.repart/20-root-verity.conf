[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
# The verity hash tree is ~0.1% of the data partition; 32M is generous headroom so
# repart does not under-allocate it (default minimal size is too small to fit it).
# Pin min == max so the hash partition is the same size in both repart passes —
# part of keeping the verity roothash reproducible so the UKI cmdline matches disk.
SizeMinBytes=32M
SizeMaxBytes=32M
