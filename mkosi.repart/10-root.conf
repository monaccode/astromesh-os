[Partition]
Type=root
Format=ext4
ReadOnly=yes
# Minimize=best does an exact (deterministic) minimal-size fit; Minimize=guess only
# estimates, so the root partition size could differ between mkosi's roothash pass
# (which the UKI cmdline embeds) and the final repart pass (which writes the disk),
# yielding a UKI roothash that does not match the on-disk verity → veritysetup waits
# for a PARTUUID that never appears. Exact minimization keeps both passes identical.
Minimize=best
Verity=data
VerityMatchKey=root
# Populate the root partition from the build tree; a custom repart layout does not
# auto-fill it, so without this the root (and thus the verity tree) is empty.
CopyFiles=/
