[Partition]
Type=root
# Versioned label (slot A = version 1) so systemd-sysupdate's MatchPattern=root-@v
# recognizes this as an installed instance and the _empty B slot as the spare.
Label=root-1
Format=ext4
ReadOnly=yes
Minimize=guess
Verity=data
VerityMatchKey=root
# Populate the root partition from the build tree; a custom repart layout does not
# auto-fill it, so without this the root (and thus the verity tree) is empty.
CopyFiles=/
