[Partition]
Type=root
Format=ext4
ReadOnly=yes
# Fixed size (min == max), no Minimize. Minimize=best is rejected by repart for a
# writable-type fs like ext4 (needs an inherently read-only fs or Verity=hash), and
# Minimize=guess estimates a size that can differ between mkosi's roothash pass (which
# the UKI cmdline embeds) and the final disk pass — yielding a UKI roothash that does
# not match the on-disk verity, so veritysetup waits in the initrd for a PARTUUID that
# never appears. A fixed size makes both passes identical → reproducible roothash.
# 448M leaves headroom over the ~244M rootfs.
SizeMinBytes=448M
SizeMaxBytes=448M
Verity=data
VerityMatchKey=root
# Populate the root partition from the build tree; a custom repart layout does not
# auto-fill it, so without this the root (and thus the verity tree) is empty.
CopyFiles=/
