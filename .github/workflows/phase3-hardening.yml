name: phase3-hardening

on:
  push:
    branches: [feat/phase3.1-noshell]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          . runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools ca-certificates openssl
      - name: Build image with break-glass hash
        env:
          PHASE0_MODE: stub
        run: |
          export ASTROMESH_BREAKGLASS_HASH="$(openssl passwd -6 breakglass)"
          mkosi --image-version=1 build
      - run: mkdir -p out && cp mkosi.output/astromesh-os-phase0_1.raw out/v1.raw
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-image
          path: out/v1.raw

  noshell-gate:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase3-image
          path: image
      - name: Install QEMU + OVMF + pexpect
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect util-linux
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no kvm; TCG fallback"
      - name: Run no-shell + break-glass gate
        run: sudo bash tests/boot/noshell-and-assert.sh image/v1.raw breakglass
