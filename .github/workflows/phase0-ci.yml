name: phase0-ci

on:
  push:
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout astromesh-os
        uses: actions/checkout@v4
      - name: Read pinned runtime ref
        id: pin
        run: |
          source runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - name: Checkout astromesh runtime at pinned ref
        uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps (inside trixie)
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        run: |
          url=$(curl -sfL https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          echo "nfpm asset: $url"
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - name: Stage .deb for image build
        run: |
          mkdir -p dist
          cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image:
    needs: build-deb
    runs-on: ubuntu-24.04
    # Run mkosi inside a privileged Debian trixie container: its mkosi/tools match
    # the image distro exactly (no version drift), Python is 3.13, and --privileged
    # grants the loop-device access mkosi's disk build needs.
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools \
            ca-certificates
          mkosi --version
      - name: Build image (stub mode)
        env:
          PHASE0_MODE: stub
        run: |
          chmod 0600 phase3/secureboot/db.key  # git can't store 0600; mkosi rejects a looser SecureBootKey
          mkosi build
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: phase0-image
          path: mkosi.output/*.raw

  boot-gate:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download disk image
        uses: actions/download-artifact@v4
        with:
          name: phase0-image
          path: image
      - name: Install QEMU + curl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 curl qemu-utils ovmf
      - name: Convert raw to qcow2
        run: qemu-img convert -O qcow2 image/*.raw phase0.qcow2
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no /dev/kvm; will fall back to TCG"
      - name: Run boot gate
        run: bash tests/boot/run-and-assert.sh phase0.qcow2
