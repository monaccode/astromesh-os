name: phase4-otel

# NOTE: the gate proves OTLP EXPORT end-to-end, which needs the Fase 4.3 node-source change (OTLP
# bridge activation) in the runtime. CI builds the .deb from monaccode/astromesh at the ref pinned in
# runtime.pin — so this workflow is green only once those node changes are merged there AND runtime.pin
# is bumped to a ref that includes them. The local gate (dev-loop.sh otel) uses a locally rebuilt .deb.

on:
  push:
    branches: [feat/phase4.3-otel]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          . runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools ca-certificates curl
      - name: Build image
        env:
          PHASE0_MODE: stub
        run: mkosi --image-version=1 build
      - run: mkdir -p out && cp mkosi.output/astromesh-os-phase0_1.raw out/v1.raw
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-otel-image
          path: out/v1.raw

  otel-export-gate:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase4-otel-image
          path: image
      - name: Install QEMU + OVMF + swtpm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools curl
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no kvm; TCG fallback"
      - name: Run OTel export gate
        run: sudo bash tests/boot/otel-export-and-assert.sh image/v1.raw
