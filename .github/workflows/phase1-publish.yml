name: phase1-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          . runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps (inside trixie)
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        run: |
          url=$(curl -sfL https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v7
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools ca-certificates
      - name: Build image (real mode)
        env:
          PHASE0_MODE: real
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod 0600 phase3/secureboot/db.key  # git can't store 0600; mkosi rejects a looser SecureBootKey
          mkosi build
      - name: Assert image size (Phase 1 gate — minimal image)
        env:
          MAX_MB: 500
        run: |
          RAW=$(ls mkosi.output/*.raw | grep -vE '\.(esp|var|root-[^.]*)\.raw$')
          # Real blocks, not apparent size. The .raw is sparse: the partition layout is fixed
          # (ESP 512M + root-A 448M + verity-A 32M + var 256M + the empty A/B spare root 512M +
          # verity-B 32M), so `du --apparent-size` reports ~1.8G of mostly holes. `du -m` counts
          # what the image actually occupies — the number this gate is about.
          #
          # This must run HERE, not in a later job: upload/download-artifact does not preserve
          # sparseness, so downstream every hole is materialised and du would report ~1.8G.
          USED_MB=$(du -m "${RAW}" | cut -f1)
          echo "[size] ${RAW}: ${USED_MB} MB of real blocks (limit ${MAX_MB} MB)"
          if [ "${USED_MB}" -gt "${MAX_MB}" ]; then
            echo "[size] FAIL: the image grew past the Phase 1 budget of ${MAX_MB} MB."
            echo "[size] Largest contributors in the rootfs:"
            du -sh mkosi.output/*.raw || true
            exit 1
          fi
          echo "[size] PASS: within the Phase 1 budget"
      - uses: actions/upload-artifact@v7
        with:
          name: phase1-image
          path: mkosi.output/*.raw

  # Gate what actually gets published: the v0.33.0 image built and passed every check here,
  # then died at boot on a missing runtime dependency. Publishing without booting the disk
  # first means shipping that. Real-mode images have no stub provider, so this asserts boot +
  # /v1/health + immutability (ASSERT_AGENT=0); phase0-ci still covers the full agent run.
  boot-gate:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: phase1-image
          path: image
      - name: Install QEMU + curl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 curl qemu-utils ovmf
      - name: Convert raw to qcow2
        run: |
          # SplitArtifacts emits per-partition .raw files alongside the full disk; select the
          # combined disk (the only .raw without a partition infix), or qemu-img concatenates
          # them and the GPT lands at the wrong offset.
          RAW=$(ls image/*.raw | grep -vE '\.(esp|var|root-[^.]*)\.raw$')
          echo "[boot] combined disk: ${RAW}"
          qemu-img convert -O qcow2 "${RAW}" phase1.qcow2
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no /dev/kvm; will fall back to TCG"
      - name: Run boot gate
        env:
          ASSERT_AGENT: "0"
        run: bash tests/boot/run-and-assert.sh phase1.qcow2

  publish:
    needs: boot-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: phase1-image
          path: image
      - name: Install ORAS + zstd
        run: |
          url=$(curl -sfL https://api.github.com/repos/oras-project/oras/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_linux_amd64.tar.gz')))")
          curl -sfL "$url" -o oras.tgz
          tar -xzf oras.tgz oras
          sudo mv oras /usr/local/bin/oras
          oras version
          # push.sh compresses the disk before upload; don't rely on the runner image for it.
          if ! command -v zstd >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          zstd --version
      - name: Validate ORAS tooling
        run: bash -n cloud/oras/push.sh cloud/oras/pull.sh
      - name: Publish artifact (only with DOCKERHUB_TOKEN)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ORAS_REPO: docker.io/fulfarodev/astromesh-os
          ORAS_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          # Only a tag build is a release, and only a release may move :latest.
          PUSH_LATEST: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: |
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "No DOCKERHUB_TOKEN secret — skipping real push (tooling validated)."
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | oras login docker.io -u fulfarodev --password-stdin
          # SplitArtifacts emits per-partition .raw files alongside the full disk; `head -1`
          # would pick the alphabetically-first split (.esp.raw), not the bootable disk. Select
          # the combined disk: the only .raw without a partition infix (.esp/.var/.root-*).
          RAW=$(ls image/*.raw | grep -vE '\.(esp|var|root-[^.]*)\.raw$')
          ORAS_TAG="${ORAS_TAG#v}" bash cloud/oras/push.sh "${RAW}"
