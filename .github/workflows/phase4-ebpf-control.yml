name: phase4-ebpf-control

# Fase 4.4e gate: the Rust daemon DECIDES (denies an over-quota flow) and the eBPF program ENFORCES
# (drops its egress). Like the other phase4 gates this needs the node-source OTLP bridge + ebpf flag
# handling, so CI is green only once runtime.pin points at a ref that includes them. The local gate
# (dev-loop.sh ebpf-control) rebuilds the .deb locally.

on:
  push:
    branches: [feat/phase4.4e-ebpf-control]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          . runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools ca-certificates curl
      - name: Build minimal OTel Collector via ocb (postinst has no network; core distro too big)
        run: |
          ver=0.116.0
          apt-get install -y golang-go
          tmp=$(mktemp -d)
          cp phase4/otel/builder-config.yaml "$tmp/"
          ( cd "$tmp" && go run "go.opentelemetry.io/collector/cmd/builder@v${ver}" --config=builder-config.yaml )
          install -m 0755 "$tmp/_build/otelcol-astromesh" dist/otelcol
          dist/otelcol --version
      - name: Build the Rust eBPF control daemon (libbpf-rs; postinst has no cargo)
        run: |
          apt-get install -y rustc cargo clang libbpf-dev bpftool libelf-dev zlib1g-dev pkg-config
          ( cd phase4/ebpf/rust && cargo build --release )
          install -m 0755 phase4/ebpf/rust/target/release/astromesh-ebpf dist/astromesh-ebpf
          ls -la dist/astromesh-ebpf
      - name: Build image
        env:
          PHASE0_MODE: stub
        run: |
          chmod 0600 phase3/secureboot/db.key  # git can't store 0600; mkosi rejects a looser SecureBootKey
          mkosi --image-version=1 build
      - run: mkdir -p out && cp mkosi.output/astromesh-os-phase0_1.raw out/v1.raw
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-ebpf-control-image
          path: out/v1.raw

  ebpf-control-gate:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase4-ebpf-control-image
          path: image
      - name: Install QEMU + OVMF + swtpm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools curl
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no kvm; TCG fallback"
      - name: Run eBPF control gate
        run: sudo bash tests/boot/ebpf-control-and-assert.sh image/v1.raw
