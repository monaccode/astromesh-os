name: phase2b-update

on:
  push:
    branches: [feat/phase2b, feat/phase2b-rollback]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          . runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticate the API call to avoid unauthenticated rate limits.
          url=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-images:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools ca-certificates
      - name: Build v1 (full image)
        env:
          PHASE0_MODE: stub
        run: mkosi --image-version=1 build
      - name: List v1 artifacts
        run: ls -la mkosi.output
      - name: Diagnostic — inspect v1 UKI cmdline + partition layout
        # Static, boot-independent evidence for the verity-under-UKI question:
        #   (1) does the UKI cmdline actually carry roothash=? (mkosi should add it)
        #   (2) are the two Type=root / two Type=root-verity partitions laid out as
        #       expected, and is the A-slot UUID derived from the roothash?
        run: |
          set -x
          uki="mkosi.output/astromesh-os-phase0_1.efi"
          echo "=== UKI cmdline (.cmdline section) ==="
          if [ -f "$uki" ]; then
            UKIFY=$(command -v ukify || echo /usr/lib/systemd/ukify)
            "$UKIFY" inspect "$uki" 2>&1 | sed -n '1,250p' || true
          else
            echo "no split UKI at $uki"; ls -la mkosi.output || true
          fi
          echo "=== v1 partition table (types + UUIDs) ==="
          sfdisk -d mkosi.output/astromesh-os-phase0_1.raw 2>/dev/null \
            || fdisk -l mkosi.output/astromesh-os-phase0_1.raw 2>/dev/null \
            || echo "no sfdisk/fdisk available"
      - run: mkdir -p out && cp mkosi.output/astromesh-os-phase0_1.raw out/v1.raw
      - name: Build v2 (split artifacts)
        env:
          PHASE0_MODE: stub
        run: mkosi --image-version=2 --force build
      - name: Stage v2 split artifacts for sysupdate
        run: |
          mkdir -p update-served
          # Serve the root + verity split images.
          cp -L mkosi.output/astromesh-os-phase0_2.root-x86-64.raw update-served/
          cp -L mkosi.output/astromesh-os-phase0_2.root-x86-64-verity.raw update-served/
          # With UnifiedKernelImages=yes mkosi emits a standalone UKI named
          # astromesh-os-phase0_<ver>.efi — serve it (matches the UKI transfer pattern).
          cp -L mkosi.output/astromesh-os-phase0_2.efi update-served/
          echo "=== served ==="; ls -la update-served
      - name: Build v2-broken (unhealthy, for rollback gate)
        # Built LAST so it overwrites mkosi.output after the good v2 was already
        # staged to update-served/. ASTROMESH_BREAK_HEALTH masks astromeshd so
        # /v1/health never comes up — exercises the boot-counting rollback.
        env:
          PHASE0_MODE: stub
          ASTROMESH_BREAK_HEALTH: "1"
        run: mkosi --image-version=2 --force build
      - name: Stage v2-broken split artifacts
        run: |
          mkdir -p update-served-broken
          cp -L mkosi.output/astromesh-os-phase0_2.root-x86-64.raw update-served-broken/
          cp -L mkosi.output/astromesh-os-phase0_2.root-x86-64-verity.raw update-served-broken/
          cp -L mkosi.output/astromesh-os-phase0_2.efi update-served-broken/
          echo "=== broken v2 ==="; ls -la update-served-broken
      - uses: actions/upload-artifact@v4
        with:
          name: phase2b-v1
          path: out/v1.raw
      - uses: actions/upload-artifact@v4
        with:
          name: phase2b-v2-served
          path: update-served/*
      - uses: actions/upload-artifact@v4
        with:
          name: phase2b-v2-broken
          path: update-served-broken/*

  update-gate:
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase2b-v1
          path: image
      - uses: actions/download-artifact@v4
        with:
          name: phase2b-v2-served
          path: update-served
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf curl
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no kvm; TCG fallback"
      - name: Serve v2 artifacts over HTTP (10.0.2.2:8088 from the guest)
        run: |
          cd update-served
          # The custom updater reads the newest version from a LATEST file.
          echo "2" > LATEST
          echo "=== served ==="; ls -la
          nohup python3 -m http.server 8088 >/tmp/http.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8088/LATEST
      - name: Convert v1 to qcow2
        run: qemu-img convert -O qcow2 image/v1.raw v1.qcow2
      - name: Run A/B update gate
        run: bash tests/boot/update-and-assert.sh v1.qcow2

  rollback-gate:
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase2b-v1
          path: image
      - uses: actions/download-artifact@v4
        with:
          name: phase2b-v2-broken
          path: update-served
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf curl
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm 2>/dev/null || echo "no kvm; TCG fallback"
      - name: Serve unhealthy v2 over HTTP (10.0.2.2:8088 from the guest)
        run: |
          cd update-served
          echo "2" > LATEST
          echo "=== served ==="; ls -la
          nohup python3 -m http.server 8088 >/tmp/http.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8088/LATEST
      - name: Convert v1 to qcow2
        run: qemu-img convert -O qcow2 image/v1.raw v1.qcow2
      - name: Run A/B rollback gate
        run: bash tests/boot/rollback-and-assert.sh v1.qcow2
