name: phase0-nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          source runtime.pin
          echo "ref=${ASTROMESH_REF}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: monaccode/astromesh
          ref: ${{ steps.pin.outputs.ref }}
          path: _runtime
      - name: Install build deps (inside trixie)
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl ca-certificates build-essential
      - name: Install nfpm
        run: |
          url=$(curl -sfL https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print(next(x['browser_download_url'] for x in a if x['name'].endswith('_amd64.deb')))")
          echo "nfpm asset: $url"
          curl -sfL "$url" -o nfpm.deb
          apt-get install -y ./nfpm.deb
      - name: Build .deb
        working-directory: _runtime/astromesh-node
        run: bash packaging/build-deb.sh
      - run: mkdir -p dist && cp _runtime/astromesh-node/dist/astromesh-node_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: astromesh-deb
          path: dist/*.deb

  build-image-real:
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astromesh-deb
          path: dist
      - name: Install mkosi + image tools
        run: |
          apt-get update
          apt-get install -y mkosi systemd-ukify systemd-boot mtools dosfstools \
            ca-certificates
          mkosi --version
      - name: Build image (real mode)
        env:
          PHASE0_MODE: real
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod 0600 phase3/secureboot/db.key  # git can't store 0600; mkosi rejects a looser SecureBootKey
          mkosi build
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-image-real
          path: mkosi.output/*.raw

  boot-gate-real:
    needs: build-image-real
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase0-image-real
          path: image
      - name: Install QEMU + curl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 curl qemu-utils
      - name: Convert raw to qcow2
        run: |
          # See phase0-ci.yml: SplitArtifacts emits per-partition .raw files; a bare *.raw glob
          # makes qemu-img concatenate them (ESP first) and corrupt the GPT. Pick the combined
          # disk (the only .raw without a partition infix).
          RAW=$(ls image/*.raw | grep -vE '\.(esp|var|root-[^.]*)\.raw$')
          echo "[boot] combined disk: ${RAW}"
          qemu-img convert -O qcow2 "${RAW}" phase0.qcow2
      - name: Run boot gate against real OpenAI
        run: bash tests/boot/run-and-assert.sh phase0.qcow2
